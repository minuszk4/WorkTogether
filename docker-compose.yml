x-service-healthcheck: &service-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health >/dev/null || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  # ----------------------------------------------------
  # Infrastructure
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: worktogether_postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - worktogether_network

  redis:
    image: redis:7-alpine
    container_name: worktogether_redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - worktogether_network

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: worktogether_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - worktogether_network

  livekit:
    image: livekit/livekit-server@sha256:2c6869d2d5ff6c9c0166f47be1c92dad6928bfecfa5e4060a6ece48db8accfa3
    container_name: worktogether_livekit
    command: --config /etc/livekit.yaml
    env_file: .env
    environment:
      LIVEKIT_KEYS: "devkey: dev_livekit_secret_change_me_32_chars_minimum"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50100-50150:50100-50150/udp"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
    networks:
      - worktogether_network

  # ----------------------------------------------------
  # Go Microservices
  # ----------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: worktogether_auth_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=worktogether_auth
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=${AUTH_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: worktogether_user_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=worktogether_user
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=${USER_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  room-service:
    build:
      context: .
      dockerfile: ./services/room-service/Dockerfile
    container_name: worktogether_room_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=worktogether_room
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=${ROOM_PORT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  chat-service:
    build:
      context: .
      dockerfile: ./services/chat-service/Dockerfile
    container_name: worktogether_chat_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=worktogether_chat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ROOM_SERVICE_GRPC=room-service:50051
      - PORT=${CHAT_PORT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      room-service:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  music-service:
    build:
      context: .
      dockerfile: ./services/music-service/Dockerfile
    container_name: worktogether_music_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=worktogether_music
      - PORT=${MUSIC_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  playlist-service:
    build:
      context: .
      dockerfile: ./services/playlist-service/Dockerfile
    container_name: worktogether_playlist_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=worktogether_playlist
      - PORT=${PLAYLIST_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  playback-service:
    build:
      context: .
      dockerfile: ./services/playback-service/Dockerfile
    container_name: worktogether_playback_service
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=${PLAYBACK_PORT}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  voice-service:
    build:
      context: .
      dockerfile: ./services/voice-service/Dockerfile
    container_name: worktogether_voice_service
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ROOM_SERVICE_GRPC=room-service:50051
      - PORT=${VOICE_PORT}
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=dev_livekit_secret_change_me_32_chars_minimum
    depends_on:
      redis:
        condition: service_healthy
      room-service:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    container_name: worktogether_notification_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=worktogether_notification
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=${NOTIFICATION_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  timer-service:
    build:
      context: .
      dockerfile: ./services/timer-service/Dockerfile
    container_name: worktogether_timer_service
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8093
      - ROOM_SERVICE_GRPC=room-service:50051
    depends_on:
      redis:
        condition: service_healthy
      playback-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  collab-service:
    build:
      context: .
      dockerfile: ./services/collab-service/Dockerfile
    container_name: worktogether_collab_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=worktogether_collab
      - PORT=8094
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped
    networks:
      - worktogether_network
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------
  # API Gateway
  # ----------------------------------------------------
  nginx:
    image: nginx@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: worktogether_nginx
    ports:
      - "${GATEWAY_PORT}:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      music-service:
        condition: service_healthy
      playlist-service:
        condition: service_healthy
      playback-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      timer-service:
        condition: service_healthy
      collab-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - worktogether_network

  # ----------------------------------------------------
  # Observability
  # ----------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: worktogether_jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - worktogether_network

  prometheus:
    image: prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: worktogether_prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - worktogether_network

  grafana:
    image: grafana/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: worktogether_grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - worktogether_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  worktogether_network:
    name: worktogether_network
    driver: bridge
