<div class="room-shell" [ngClass]="'theme-' + ((state.activeRoom$ | async)?.theme || 'cool-ocean')">
  <app-room-sidebar
    [isMicActive]="isMicActive"
    [isMuted]="isMuted"
    [isScreenSharing]="isScreenSharing"
    [isCameraActive]="isCameraActive"
    [isVoiceBusy]="isVoiceBusy"
    [isScreenShareBusy]="isScreenShareBusy"
    [isCameraBusy]="isCameraBusy"
    [avatarUrl]="currentUserAvatar"
    [displayName]="currentUserDisplayName"
    (back)="onBackToLobbyClick()"
    (voiceChannel)="onVoiceChannelClick()"
    (muteToggle)="onMuteToggleClick()"
    (screenShareToggle)="onScreenShareToggleClick()"
    (cameraToggle)="onCameraToggleClick()">
  </app-room-sidebar>

  <main class="room-main">
    <app-room-vibe-meter></app-room-vibe-meter>
    <app-room-reactions-canvas></app-room-reactions-canvas>
    
    <app-room-voice-pills></app-room-voice-pills>
    <app-room-stage>
      <!-- screenshare/video media slot: legacy voice-grid surfaces until parity -->
    </app-room-stage>
  </main>

  @if (isQueueOpen) {
    <aside class="room-queue-panel">
      <app-room-queue></app-room-queue>
    </aside>
  }

  <div class="room-player-bar">
    <app-room-quick-reactions></app-room-quick-reactions>
    <app-room-player-bar></app-room-player-bar>
  </div>

  @if (isChatOpen) {
    <div class="room-chat-dock">
      <app-room-chat [isOpen]="isChatOpen"></app-room-chat>
    </div>
  }

  @if (isSubroomsOpen) {
    <div class="room-subrooms-panel">
      <app-room-subrooms [roomId]="roomId"></app-room-subrooms>
    </div>
  }

  @if (isNotesOpen) {
    <div class="room-notes-panel">
      <app-room-collab-notes [roomId]="roomId"></app-room-collab-notes>
    </div>
  }

  @if (isLyricsOpen) {
    <div class="room-lyrics-panel">
      <app-room-lyrics></app-room-lyrics>
    </div>
  }

  @if (isBookmarksOpen) {
    <div class="room-bookmarks-panel">
      <app-room-bookmarks></app-room-bookmarks>
    </div>
  }

  @if (isTimerOpen) {
    <div class="room-timer-overlay">
      <app-room-timer [roomId]="roomId"></app-room-timer>
    </div>
  }

  @if (isIdentityOpen) {
    <div class="room-identity-panel">
      <app-room-identity></app-room-identity>
    </div>
  }

  @if (isStatsOpen) {
    <div class="room-stats-panel">
      <app-history-stats></app-history-stats>
    </div>
  }

  <app-room-poll-widget></app-room-poll-widget>
</div>
