<div class="room-shell" [ngClass]="'theme-' + ((state.activeRoom$ | async)?.theme || 'cool-ocean')">
  <app-room-sidebar
    [isMicActive]="isMicActive"
    [isMuted]="isMuted"
    [isScreenSharing]="isScreenSharing"
    [isCameraActive]="isCameraActive"
    [isVoiceBusy]="isVoiceBusy"
    [isScreenShareBusy]="isScreenShareBusy"
    [isCameraBusy]="isCameraBusy"
	[connectionState]="voiceConnectionState"
    [avatarUrl]="currentUserAvatar"
    [displayName]="currentUserDisplayName"
    (back)="onBackToLobbyClick()"
    (voiceChannel)="onVoiceChannelClick()"
    (muteToggle)="onMuteToggleClick()"
    (screenShareToggle)="onScreenShareToggleClick()"
    (cameraToggle)="onCameraToggleClick()">
  </app-room-sidebar>

  <main class="room-main">
    <div class="room-mode-switcher" role="group" aria-label="Chế độ phòng">
      <button type="button" [class.active]="roomMode === 'chill'" [disabled]="!canChangeRoomMode" (click)="changeRoomMode('chill')">Chill</button>
      <button type="button" [class.active]="roomMode === 'focus'" [disabled]="!canChangeRoomMode" (click)="changeRoomMode('focus')">Focus</button>
      <button type="button" [class.active]="roomMode === 'collaborate'" [disabled]="!canChangeRoomMode" (click)="changeRoomMode('collaborate')">Collaborate</button>
    </div>
    <app-room-vibe-meter></app-room-vibe-meter>
    <app-room-reactions-canvas></app-room-reactions-canvas>
    
    <app-room-voice-pills></app-room-voice-pills>
    <app-room-stage>
      <!-- screenshare/video media slot: legacy voice-grid surfaces until parity -->
    </app-room-stage>
  </main>

  @if (isQueueOpen) {
    <aside class="room-queue-panel">
      <app-room-queue></app-room-queue>
    </aside>
  }

  <div class="room-player-bar">
    <app-room-quick-reactions></app-room-quick-reactions>
    <app-room-player-bar></app-room-player-bar>
  </div>

  @if (isChatOpen) {
    <div class="room-chat-dock">
      <app-room-chat [isOpen]="isChatOpen"></app-room-chat>
    </div>
  }

  @if (isSubroomsOpen) {
    <div class="room-subrooms-panel">
      <app-room-subrooms [roomId]="roomId"></app-room-subrooms>
    </div>
  }

  @if (isNotesOpen) {
    <div class="room-notes-panel">
      <app-room-collab-notes [roomId]="roomId"></app-room-collab-notes>
    </div>
  }

  @if (isLyricsOpen) {
    <div class="room-lyrics-panel">
      <app-room-lyrics></app-room-lyrics>
    </div>
  }

  @if (isBookmarksOpen) {
    <div class="room-bookmarks-panel">
      <app-room-bookmarks></app-room-bookmarks>
    </div>
  }

  @if (isTimerOpen) {
    <div class="room-timer-overlay">
      <app-room-timer [roomId]="roomId"></app-room-timer>
    </div>
  }

  @if (isIdentityOpen) {
    <div class="room-identity-panel">
      <app-room-identity></app-room-identity>
    </div>
  }

  @if (isStatsOpen) {
    <div class="room-stats-panel">
      <app-history-stats></app-history-stats>
    </div>
  }

  <app-room-poll-widget></app-room-poll-widget>

	@if (isVoicePrejoinOpen) {
	  <div class="voice-prejoin-backdrop" (click)="isVoicePrejoinOpen = false">
		<section class="voice-prejoin" role="dialog" aria-modal="true" aria-labelledby="voice-prejoin-title" (click)="$event.stopPropagation()">
		  <h2 id="voice-prejoin-title">Tham gia voice</h2>
		  <p>Microphone sẽ tắt khi bạn vào phòng.</p>
		  <label for="voice-microphone">Microphone</label>
		  <select id="voice-microphone" [(ngModel)]="selectedAudioInput">
			@if (audioInputDevices.length === 0) {
			  <option value="">Thiết bị mặc định</option>
			}
			@for (device of audioInputDevices; track device.deviceId; let index = $index) {
			  <option [value]="device.deviceId">{{ device.label || ('Microphone ' + (index + 1)) }}</option>
			}
		  </select>
		  <div class="voice-prejoin-actions">
			<button type="button" class="btn btn-secondary" (click)="isVoicePrejoinOpen = false">Hủy</button>
			<button type="button" class="btn btn-primary" (click)="confirmVoiceJoin()">Vào phòng</button>
		  </div>
		</section>
	  </div>
	}
</div>
