user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$masked_request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip settings
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Định nghĩa cấu hình map để nâng cấp kết nối WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # CORS origin mapping
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" "$http_origin";
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
    }

    # Mask token query parameters in logs
    map $request $masked_request {
        default $request;
        "~^(?<prefix>[^\?]+)\?token=[^&\s]+(?<suffix>.*)$" "${prefix}?token=***${suffix}";
        "~^(?<prefix>[^\?]+)\?(?<mid>.*)&token=[^&\s]+(?<suffix>.*)$" "${prefix}?${mid}&token=***${suffix}";
    }

    # Rate Limiting — dev-friendly (tăng mạnh để test)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=500r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 8080;
        server_name localhost;

        # Cấu hình CORS chung cho tất cả các location
        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cache-Control, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Xử lý Preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Áp dụng rate limiting mặc định
        limit_req zone=general_limit burst=100 nodelay;

        # ----------------------------------------------------
        # 1. Auth Service
        # ----------------------------------------------------
        location /api/v1/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            set $auth_upstream http://auth-service:8081;
            proxy_pass $auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 2. User Service
        # ----------------------------------------------------
        location /api/v1/users {
            set $user_upstream http://user-service:8082;
            proxy_pass $user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 3. Room Service
        # ----------------------------------------------------
        location /api/v1/rooms {
            set $room_upstream http://room-service:8083;
            proxy_pass $room_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 4. Chat Service (REST & WebSocket)
        # ----------------------------------------------------
        # Routing WebSocket chat của phòng
        location ~ ^/api/v1/rooms/([^/]+)/chat/ws$ {
            set $chat_ws_upstream http://chat-service:8084;
            proxy_pass $chat_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s; # Giữ connection WebSocket không bị timeout sớm
            proxy_send_timeout 3600s;
        }

        # Routing các API REST của Chat
        location ~ ^/api/v1/rooms/([^/]+)/chat/ {
            set $chat_upstream http://chat-service:8084;
            proxy_pass $chat_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 5. Playback Service (REST & WebSocket)
        # ----------------------------------------------------
        # Routing WebSocket playback sync của phòng
        location ~ ^/api/v1/rooms/([^/]+)/playback/ws$ {
            set $playback_ws_upstream http://playback-service:8087;
            proxy_pass $playback_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Routing các API REST của Playback và Queue
        location ~ ^/api/v1/rooms/([^/]+)/playback/ {
            set $playback_upstream http://playback-service:8087;
            proxy_pass $playback_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 6. Music Service
        # ----------------------------------------------------
        location /api/v1/music {
            set $music_upstream http://music-service:8085;
            proxy_pass $music_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 7. Playlist Service
        # ----------------------------------------------------
        location /api/v1/playlists {
            set $playlist_upstream http://playlist-service:8086;
            proxy_pass $playlist_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 7a. Timer Service (REST & WebSocket)
        # ----------------------------------------------------
        location ~ ^/api/v1/rooms/([^/]+)/timer/ws$ {
            set $timer_ws_upstream http://timer-service:8093;
            proxy_pass $timer_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/api/v1/rooms/([^/]+)/timer/ {
            set $timer_upstream http://timer-service:8093;
            proxy_pass $timer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 7b. Collab Service (REST & WebSocket)
        # ----------------------------------------------------
        location ~ ^/api/v1/rooms/([^/]+)/collab/ws$ {
            set $collab_ws_upstream http://collab-service:8094;
            proxy_pass $collab_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/api/v1/rooms/([^/]+)/collab/ {
            set $collab_upstream http://collab-service:8094;
            proxy_pass $collab_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 8. Voice Service
        # ----------------------------------------------------
        location /api/v1/voice {
            set $voice_upstream http://voice-service:8088;
            proxy_pass $voice_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 9. Notification Service (Server-Sent Events)
        # ----------------------------------------------------
        location /api/v1/notifications/stream {
            set $notification_stream_upstream http://notification-service:8089;
            proxy_pass $notification_stream_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Tắt cache và buffering bắt buộc đối với SSE
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        location /api/v1/notifications {
            set $notification_upstream http://notification-service:8089;
            proxy_pass $notification_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
