name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Test and Build Go Microservices
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Verify dependencies and formats
      run: |
        find . -name "go.mod" -execdir go mod tidy \;
        find . -name "*.go" -execdir go fmt {} +

    - name: Run Unit Tests
      run: |
        for dir in services/*/; do
          if [ -f "$dir/go.mod" ]; then
            echo "Testing $dir..."
            cd "$dir"
            go test -v ./...
            cd -
          fi
        done

    - name: Build Services
      run: |
        for dir in services/*/; do
          if [ -f "$dir/cmd/server/main.go" ]; then
            echo "Building $dir..."
            cd "$dir"
            go build -o /tmp/$(basename "$dir") ./cmd/server/main.go
            cd -
          fi
        done
