name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Test all Go modules
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            pkg
            services/auth-service
            services/chat-service
            services/collab-service
            services/music-service
            services/notification-service
            services/playback-service
            services/playlist-service
            services/room-service
            services/timer-service
            services/user-service
            services/voice-service
          )
          for module in "${modules[@]}"; do
            echo "== ${module} =="
            (cd "${module}" && go test ./...)
          done

  frontend:
    name: Frontend builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-client/package-lock.json
            web-client-vanilla/package-lock.json

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Test Angular client
        working-directory: web-client
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm ci
          npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build Angular client
        working-directory: web-client
        run: |
          npm run build

      - name: Build vanilla client
        working-directory: web-client-vanilla
        run: |
          npm ci
          npm run build

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres_password
          POSTGRES_DB=postgres
          REDIS_PASSWORD=redis_password
          MINIO_ROOT_USER=minio_admin
          MINIO_ROOT_PASSWORD=minio_password
          MINIO_ACCESS_KEY=minio_admin
          MINIO_SECRET_KEY=minio_password
          JWT_SECRET=ci_jwt_secret_change_me_at_least_32_chars_long
          JWT_EXP_MINS=15
          AUTH_PORT=8081
          AUTO_VERIFY_EMAIL=true
          FRONTEND_URL=http://localhost:4200
          APP_BASE_URL=http://localhost:8080
          ALLOWED_ORIGINS=http://localhost:3000,http://localhost:4200
          SMTP_HOST=
          SMTP_PORT=587
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_FROM=
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          GOOGLE_REDIRECT_URL=http://localhost:8080/api/v1/auth/google/callback
          USER_PORT=8082
          ROOM_PORT=8083
          CHAT_PORT=8084
          MUSIC_PORT=8085
          MINIO_ENDPOINT=minio:9000
          MINIO_BUCKET=music
          MINIO_PUBLIC_URL=http://localhost:9000
          PLAYLIST_PORT=8086
          PLAYBACK_PORT=8087
          PLAYBACK_SERVICE_GRPC=playback-service:50052
          VOICE_PORT=8088
          LIVEKIT_URL=ws://localhost:7880
          LIVEKIT_API_KEY=devkey
          LIVEKIT_API_SECRET=ci_livekit_secret_change_me_32_chars_minimum
          NOTIFICATION_PORT=8089
          OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
          ROOM_SERVICE_GRPC=room-service:50051
          ROOM_SERVICE_GRPC_ADDR=localhost:50051
          GATEWAY_PORT=8080
          EOF

      - name: Validate Compose file
        run: docker compose config >/dev/null

      - name: Build Docker images
        run: docker compose build

      - name: Smoke test Compose stack
        run: docker compose up -d --wait

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Clean up Compose stack
        if: always()
        run: docker compose down -v
